# Generated by scripts/build-api-docs.mjs. Do not edit by hand; run "npm run build".
openapi: "3.1.0"
info:
  title: "EVD n8n Webhooks"
  version: "1.0.0"
  description: |-
    Every webhook endpoint exposed by the EVD n8n workflows, generated from the workflow JSON files in this repo.

    The instance is only reachable over the EVD VPN. Request bodies are not declared in n8n; the fields listed here are the ones each workflow reads.
servers:
  - url: "https://auto.evdsky.com:45333/webhook"
    description: "n8n production webhooks (EVD VPN only)"
tags:
  - name: "CLEV"
  - name: "Google Workspace"
  - name: "HighLevel"
paths:
  "/clev/create-menu":
    post:
      operationId: "crear-menu-reportes-clev"
      summary: "Crear menú reportes CLEV"
      description: |-
        Regenerates the numbered menu of HighLevel pipelines that people choose from when they ask for a report. It lists the current pipelines, numbers them, and writes the menu text and the list of valid numbers into two HighLevel custom values.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Any call with valid auth | n8n's immediate "workflow started" response. It says nothing about whether the menu was updated. |

        [Workflow documentation: Crear menú reportes CLEV](../#/clev/crear-menu-reportes-clev) — node `Webhook`.
      tags:
        - "CLEV"
      security:
        - clevWebhookAuth: []
      responses:
        "200":
          description: "Sent immediately, before the workflow runs. The body only confirms that the workflow was started."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/clev/crear-menu-reportes-clev/crear-menu-reportes-clev.json"
        node: "Webhook"
        responseMode: "onReceived"
        credential: "Header Auth new auto@clev.org"
  "/clev/reporte":
    post:
      operationId: "informe-de-oportunidades-clev-v2-1"
      summary: "Informe de oportunidades CLEV v2.1"
      description: |-
        Builds a report of HighLevel opportunities, counted by pipeline, stage and contact type, and posts it as a message in Basecamp. It is called over a webhook with the number of the pipeline the requester picked from a menu, and afterwards stores the link to the Basecamp message back in HighLevel.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Report posted | An empty response, once the Basecamp message exists and the link has been stored. |
        | Any step fails | n8n's error response; the failure is also emailed by `Notificación de errores`. |

        [Workflow documentation: Informe de oportunidades CLEV v2.1](../#/clev/informe-de-oportunidades-clev-v2-1) — node `Webhook generación reporte`.
      tags:
        - "CLEV"
      security:
        - clevWebhookAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                full_name:
                  type: "string"
                  description: "Name of the requester, printed at the end of the report (\"Reporte solicitado por\")."
                customData:
                  type: "object"
                  properties:
                    selection:
                      type: "string"
                      description: "Number of the menu entry the requester chose. `0` means all pipelines; any other number is a pipeline's position in the menu stored in HighLevel."
                  required:
                    - "selection"
              required:
                - "customData"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/clev/informe-de-oportunidades-clev-v2-1/informe-de-oportunidades-clev-v2-1.json"
        node: "Webhook generación reporte"
        responseMode: "lastNode"
        credential: "Header Auth new auto@clev.org"
  "/test":
    post:
      operationId: "webhook-test"
      summary: "Webhook test"
      description: |-
        A two-node test workflow: a webhook followed by a wait. It does nothing else and looks like a leftover from trying out webhook authentication, but it is published, so its endpoint is live.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Any call with valid auth | The output of `Wait`, which is the incoming request passed through. |

        [Workflow documentation: Webhook test](../#/clev/webhook-test) — node `Webhook`.
      tags:
        - "CLEV"
      security:
        - headerAuth: []
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/clev/webhook-test/webhook-test.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "TEst"
  "/5cb58ab5-2ee7-4020-be98-0ac665e594d1":
    post:
      operationId: "cambio-email-nombre"
      summary: "Cambio email-nombre"
      description: |-
        Changes a Google Workspace user's primary email address and, optionally, their first and last name. It is called over a webhook, answers the caller as soon as the email has changed, and then removes the alias Google leaves behind on the old address.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Email changed | The updated Google Workspace user object plus `message` (first incoming item of `Respond to Webhook`). |
        | Validation failed, or user lookup failed | No `Respond to Webhook` node runs, so n8n sends its default response for a finished workflow. The `error`, `not_found` and `debug.*` fields built by the `Set` nodes are **not** returned. |
        | Email did not change | n8n's error response, because `Stop and Error` fails the execution before any response is sent. |

        [Workflow documentation: Cambio email-nombre](../#/google-workspace/cambio-email-nombre) — node `Webhook`.
      tags:
        - "Google Workspace"
      security:
        - workspaceBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Current primary email of the user. Must look like an email and its domain must be in the `Authorized domains` data table."
                correoNuevo:
                  type: "string"
                  description: "New primary email. A call without it ends in an error, after any name change has already been applied."
                nombreNuevo:
                  type: "string"
                  description: "New first name. Skipped when empty."
                ApellidoNuevo:
                  type: "string"
                  description: "New last name. Skipped when empty. Note the capital `A`."
              required:
                - "correo"
                - "correoNuevo"
      responses:
        "200":
          description: "Sent by the `Respond to Webhook` node. Branches that never reach it get n8n's default response."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/cambio-email-nombre/cambio-email-nombre.json"
        node: "Webhook"
        responseMode: "responseNode"
        credential: "Header Auth Bearer token n8n.workspace"
  "/ee552566-6908-40e1-a58f-a496562425ce":
    get:
      operationId: "actualizar-tabla-cuentas-delegadas"
      summary: "Actualizar tabla cuentas delegadas"
      description: |-
        Keeps the n8n data table `Cuentas delegadas` in step with the real Gmail delegations. For every mailbox in the `/Cuentas Delegadas` organisational unit it reads who the delegates are, then adds the missing rows to the table and deletes the stale ones.

        [Workflow documentation: Actualizar tabla cuentas delegadas](../#/google-workspace/actualizar-tabla-cuentas-delegadas) — node `Webhook`.
      tags:
        - "Google Workspace"
      security:
        - workspaceBearer: []
      responses:
        "200":
          description: "Sent immediately, before the workflow runs. The body only confirms that the workflow was started."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/actualizar-tabla-cuentas-delegadas/actualizar-tabla-cuentas-delegadas.json"
        node: "Webhook"
        responseMode: "onReceived"
        credential: "Header Auth Bearer token n8n.workspace"
  "/workspace/user/details":
    post:
      operationId: "workspaces-user-discovery-v1-4"
      summary: "Workspaces User Discovery v1.4"
      description: |-
        Returns what a Google Workspace user has and belongs to: basic account details and, on request, admin details, shared drives, groups, delegated mailboxes, Chat spaces and Drive files. It is called over a webhook and answers with one combined object.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | User found | One object with the basic details plus a key for each section requested. |
        | Validation failed | `error` with the text built by `Prevalidation fails. Error message`. |
        | User lookup failed | `not_found`, `correo` and the `debug.*` fields from the `Not found…` node that ran. |

        [Workflow documentation: Workspaces User Discovery v1.4](../#/google-workspace/workspaces-user-discovery-v1-4) — node `Webhook`.
      tags:
        - "Google Workspace"
      security:
        - workspaceBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Email of the user to look up. Must look like an email and its domain must be in the `Authorized domains` data table."
                sharedDrives:
                  type: "boolean"
                  description: "`true` adds the shared drives the user can see."
                moreDetails:
                  type: "boolean"
                  description: "`true` adds admin flags, alternate emails and recovery contact details."
                groups:
                  type: "boolean"
                  description: "`true` adds the groups the user belongs to."
                delegated:
                  type: "boolean"
                  description: "`true` adds the mailboxes delegated to the user."
                spaces:
                  type: "boolean"
                  description: "`true` adds the user's Chat spaces and group chats."
                driveFiles:
                  type: "boolean"
                  description: "`true` adds the three Drive file sections: `sharedToUser`, `sharedByUser` and `inSharedDrivesOwnedByUser`."
              required:
                - "correo"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/workspaces-user-discovery-v1-4/workspaces-user-discovery-v1-4.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth Bearer token n8n.workspace"
  "/workspace/user/suspend":
    post:
      operationId: "suspender-cuenta-workspace-v1-0"
      summary: "Suspender cuenta Workspace v1.0"
      description: |-
        Suspends a Google Workspace user account. It is called over a webhook with the user's email address.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Account suspended | The Google Workspace user object returned by the `PUT`. |
        | Validation failed | `error` with the text built by `Prevalidation fails. Error message`. |
        | User lookup failed | `not_found`, `correo` and the `debug.*` fields from the `Not found…` node that ran. |

        [Workflow documentation: Suspender cuenta Workspace v1.0](../#/google-workspace/suspender-cuenta-workspace-v1-0) — node `Webhook`.
      tags:
        - "Google Workspace"
      security:
        - workspaceBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Email of the account to suspend. Must look like an email and its domain must be in the `Authorized domains` data table."
              required:
                - "correo"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/suspender-cuenta-workspace-v1-0/suspender-cuenta-workspace-v1-0.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth Bearer token n8n.workspace"
  "/workspace/users":
    get:
      operationId: "reporte-validacion-usuarios-totales-v-1"
      summary: "Reporte Validación Usuarios Totales v 1"
      description: |-
        Builds an Excel file of every Google Workspace user, with their groups and delegated mailboxes, and emails it. It runs when its webhook is called.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Report sent | The output of `Send an Email`. |
        | User listing failed | `not_found`, `correo` and `debug.*` from the `Not found…` node that ran. |

        [Workflow documentation: Reporte Validación Usuarios Totales v 1](../#/google-workspace/reporte-validacion-usuarios-totales-v-1) — node `Webhook`.
      tags:
        - "Google Workspace"
      security:
        - workspaceBearer: []
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/reporte-validacion-usuarios-totales-v-1/reporte-validacion-usuarios-totales-v-1.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth Bearer token n8n.workspace"
  "/615a78c5-96e9-4c21-b85f-a61fb47adc7e":
    post:
      operationId: "test-webhook-events-iniciados"
      summary: "test webhook events Iniciados"
      description: |-
        A single webhook node with nothing connected after it. It looks like a test endpoint for receiving events from the Iniciados HighLevel account: calls are accepted and can be inspected in n8n's execution log, but nothing is done with them.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Any call with valid auth | n8n's immediate "workflow started" response. |

        [Workflow documentation: test webhook events Iniciados](../#/highlevel/test-webhook-events-iniciados) — node `Webhook`.
      tags:
        - "HighLevel"
      security:
        - highlevelBearer: []
      responses:
        "200":
          description: "Sent immediately, before the workflow runs. The body only confirms that the workflow was started."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/highlevel/test-webhook-events-iniciados/test-webhook-events-iniciados.json"
        node: "Webhook"
        responseMode: "onReceived"
        credential: "Header Auth n8n.highlevel"
  "/694daab8-7fcb-487e-b550-e93ffbdda182":
    post:
      operationId: "copia-contacto-crm-a-telefono"
      summary: "Copia contacto CRM a teléfono"
      description: |-
        A single webhook node with nothing connected after it. The name says it should copy a CRM contact to a phone, but no such logic exists: the endpoint accepts a call and does nothing.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Any call with valid auth | n8n's immediate "workflow started" response. |

        [Workflow documentation: Copia contacto CRM a teléfono](../#/highlevel/copia-contacto-crm-a-telefono) — node `Webhook`.
      tags:
        - "HighLevel"
      security:
        - highlevelBearer: []
      responses:
        "200":
          description: "Sent immediately, before the workflow runs. The body only confirms that the workflow was started."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/highlevel/copia-contacto-crm-a-telefono/copia-contacto-crm-a-telefono.json"
        node: "Webhook"
        responseMode: "onReceived"
        credential: "Header Auth account"
  "/highlevel/update/contact/iniciados":
    post:
      operationId: "actualizar-tabla-cache-iniciados-iniciado-actualizado-desde-pi"
      summary: "Actualizar tabla cache iniciados - iniciado actualizado desde PI"
      description: |-
        Refreshes one person's row in the n8n data table `Cache contactos Iniciados SKY` when their contact changes in the Iniciados HighLevel account. HighLevel calls the webhook, the workflow reads the contact back from HighLevel and overwrites the cached row.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Row updated | The updated data table row. |
        | HighLevel search fails | n8n's error response; the failure is also emailed by `Notificación de errores`. |

        [Workflow documentation: Actualizar tabla cache iniciados - iniciado actualizado desde PI](../#/highlevel/actualizar-tabla-cache-iniciados-iniciado-actualizado-desde-pi) — node `Webhook`.
      tags:
        - "HighLevel"
      security:
        - highlevelBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                location:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                      description: "HighLevel location id of the account the contact belongs to."
                  required:
                    - "id"
                contact_id:
                  type: "string"
                  description: "Id of the contact that changed, in the Iniciados HighLevel account."
              required:
                - "location"
                - "contact_id"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/highlevel/actualizar-tabla-cache-iniciados-iniciado-actualizado-desde-pi/actualizar-tabla-cache-iniciados-iniciado-actualizado-desde-pi.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth n8n.highlevel"
  "/waha/participants":
    post:
      operationId: "actualizar-campo-comunidad-whatsapp-auto-col"
      summary: "Actualizar campo Comunidad WhatsApp auto COL"
      description: |-
        Keeps a HighLevel contact field in step with membership of the Colombia WhatsApp announcements group. When someone joins or leaves the group, it finds the matching contact in the Colombia HighLevel account by phone number and sets the "Grupo de avisos WhatsApp" custom field to `Ingresado` or `Retirado`.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Field updated | The HighLevel response to the contact update. |
        | Event is not a join or leave | n8n's default response; the workflow ends at `If`. |
        | Group is not a Colombia group, or no contact has that phone | n8n's error response, because a `Stop and Error` node fails the execution. |

        [Workflow documentation: Actualizar campo Comunidad WhatsApp auto COL](../#/highlevel/actualizar-campo-comunidad-whatsapp-auto-col) — node `Webhook`.
      tags:
        - "HighLevel"
      security:
        - highlevelBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                session:
                  type: "string"
                  description: "WAHA session name, used for the two lookups back into WAHA."
                payload:
                  type: "object"
                  properties:
                    participants:
                      type: "array"
                      items: {}
                      description: "Participants affected by the event. Only the first entry's `id` is used."
                    type:
                      type: "string"
                      description: "Event type. Only values containing `join` or `leave` are processed."
                    group:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "WhatsApp id of the group the event happened in."
                      required:
                        - "id"
                  required:
                    - "participants"
                    - "type"
                    - "group"
              required:
                - "session"
                - "payload"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/highlevel/actualizar-campo-comunidad-whatsapp-auto-col/actualizar-campo-comunidad-whatsapp-auto-col.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth n8n.highlevel"
components:
  securitySchemes:
    clevWebhookAuth:
      type: "apiKey"
      in: "header"
      name: "webhook-auth"
      description: "Send the secret in the `webhook-auth` header. n8n credential: `Header Auth new auto@clev.org`."
    headerAuth:
      type: "apiKey"
      in: "header"
      name: "Authorization"
      description: "n8n header auth. The header name and value are held in the n8n credential named on the endpoint; the header name shown here is a placeholder."
    highlevelBearer:
      type: "http"
      scheme: "bearer"
      description: "Send `Authorization: Bearer <token>`. n8n credential: `Header Auth n8n.highlevel`."
    workspaceBearer:
      type: "http"
      scheme: "bearer"
      description: "Send `Authorization: Bearer <token>`. n8n credential: `Header Auth Bearer token n8n.workspace`."
