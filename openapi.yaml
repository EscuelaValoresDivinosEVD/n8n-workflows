  "/workspace/users":
    get:
      operationId: "reporte-validacion-usuarios-totales-v-1"
      summary: "Reporte Validación Usuarios Totales v 1"
      description: |-
        Builds an Excel file of every Google Workspace user, with their groups and delegated mailboxes, and emails it. It runs when its webhook is called.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Report sent | The output of `Send an Email`. |
        | User listing failed | `not_found`, `correo` and `debug.*` from the `Not found…` node that ran. |

        Workflow: `Reporte Validación Usuarios Totales v 1` — node `Webhook`. Source: `workflows/google-workspace/reporte-validacion-usuarios-totales-v-1/reporte-validacion-usuarios-totales-v-1.json`.
      tags:
