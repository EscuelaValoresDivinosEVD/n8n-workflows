      security:
        - headerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Email of the account to suspend. Must look like an email and its domain must be in the `Authorized domains` data table."
              required:
