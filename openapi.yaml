paths:
  "/5cb58ab5-2ee7-4020-be98-0ac665e594d1":
    post:
      operationId: "cambio-email-nombre"
      summary: "Cambio email-nombre"
      description: |-
        Changes a Google Workspace user's primary email address and, optionally, their first and last name. It is called over a webhook, answers the caller as soon as the email has changed, and then removes the alias Google leaves behind on the old address.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | Email changed | The updated Google Workspace user object plus `message` (first incoming item of `Respond to Webhook`). |
        | Validation failed, or user lookup failed | No `Respond to Webhook` node runs, so n8n sends its default response for a finished workflow. The `error`, `not_found` and `debug.*` fields built by the `Set` nodes are **not** returned. |
        | Email did not change | n8n's error response, because `Stop and Error` fails the execution before any response is sent. |

        Workflow: `Cambio email-nombre` — node `Webhook`. Source: `workflows/google-workspace/cambio-email-nombre/cambio-email-nombre.json`.
      tags:
        - "Google Workspace"
      security:
        - headerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Current primary email of the user. Must look like an email and its domain must be in the `Authorized domains` data table."
                correoNuevo:
                  type: "string"
                  description: "New primary email. A call without it ends in an error, after any name change has already been applied."
                nombreNuevo:
                  type: "string"
                  description: "New first name. Skipped when empty."
                ApellidoNuevo:
                  type: "string"
                  description: "New last name. Skipped when empty. Note the capital `A`."
              required:
                - "correo"
                - "correoNuevo"
      responses:
        "200":
          description: "Sent by the `Respond to Webhook` node. Branches that never reach it get n8n's default response."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/cambio-email-nombre/cambio-email-nombre.json"
        node: "Webhook"
        responseMode: "responseNode"
        credential: "Header Auth Bearer token n8n.workspace"
  "/ee552566-6908-40e1-a58f-a496562425ce":
    get:
      operationId: "actualizar-tabla-cuentas-delegadas"
      summary: "Actualizar tabla cuentas delegadas"
      description: |-
        Keeps the n8n data table `Cuentas delegadas` in step with the real Gmail delegations. For every mailbox in the `/Cuentas Delegadas` organisational unit it reads who the delegates are, then adds the missing rows to the table and deletes the stale ones.

        Workflow: `Actualizar tabla cuentas delegadas` — node `Webhook`. Source: `workflows/google-workspace/actualizar-tabla-cuentas-delegadas/actualizar-tabla-cuentas-delegadas.json`.
      tags:
        - "Google Workspace"
      security:
        - headerAuth: []
      responses:
        "200":
          description: "Sent immediately, before the workflow runs. The body only confirms that the workflow was started."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/actualizar-tabla-cuentas-delegadas/actualizar-tabla-cuentas-delegadas.json"
        node: "Webhook"
        responseMode: "onReceived"
        credential: "Header Auth Bearer token n8n.workspace"
  "/workspace/user/details":
    post:
      operationId: "workspaces-user-discovery-v1-4"
      summary: "Workspaces User Discovery v1.4"
      description: |-
        Returns what a Google Workspace user has and belongs to: basic account details and, on request, admin details, shared drives, groups, delegated mailboxes, Chat spaces and Drive files. It is called over a webhook and answers with one combined object.

        ### Responses

        | Situation | What the caller gets |
        |---|---|
        | User found | One object with the basic details plus a key for each section requested. |
        | Validation failed | `error` with the text built by `Prevalidation fails. Error message`. |
        | User lookup failed | `not_found`, `correo` and the `debug.*` fields from the `Not found…` node that ran. |

        Workflow: `Workspaces User Discovery v1.4` — node `Webhook`. Source: `workflows/google-workspace/workspaces-user-discovery-v1-4/workspaces-user-discovery-v1-4.json`.
      tags:
        - "Google Workspace"
      security:
        - headerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                correo:
                  type: "string"
                  description: "Email of the user to look up. Must look like an email and its domain must be in the `Authorized domains` data table."
                sharedDrives:
                  type: "boolean"
                  description: "`true` adds the shared drives the user can see."
                moreDetails:
                  type: "boolean"
                  description: "`true` adds admin flags, alternate emails and recovery contact details."
                groups:
                  type: "boolean"
                  description: "`true` adds the groups the user belongs to."
                delegated:
                  type: "boolean"
                  description: "`true` adds the mailboxes delegated to the user."
                spaces:
                  type: "boolean"
                  description: "`true` adds the user's Chat spaces and group chats."
                driveFiles:
                  type: "boolean"
                  description: "`true` adds the three Drive file sections: `sharedToUser`, `sharedByUser` and `inSharedDrivesOwnedByUser`."
              required:
                - "correo"
      responses:
        "200":
          description: "The output of the last node the workflow executed, returned once the workflow has finished."
          content:
            "application/json":
              schema:
                type: "object"
        "403":
          description: "The authentication header is missing or wrong."
      x-n8n:
        workflowFile: "workflows/google-workspace/workspaces-user-discovery-v1-4/workspaces-user-discovery-v1-4.json"
        node: "Webhook"
        responseMode: "lastNode"
        credential: "Header Auth Bearer token n8n.workspace"
