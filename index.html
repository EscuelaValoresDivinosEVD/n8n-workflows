        content: {"openapi":"3.1.0","info":{"title":"EVD n8n Webhooks","version":"1.0.0","description":"Every webhook endpoint exposed by the EVD n8n workflows, generated from the workflow JSON files in this repo.\n\nThe instance is only reachable over the EVD VPN. Request bodies are not declared in n8n; the fields listed here are the ones each workflow reads."},"servers":[{"url":"https://auto.evdsky.com:45333/webhook","description":"n8n production webhooks (EVD VPN only)"}],"tags":[{"name":"CLEV"},{"name":"Google Workspace"}],"paths":{"/clev/create-menu":{"post":{"operationId":"crear-menu-reportes-clev","summary":"Crear menú reportes CLEV","description":"Regenerates the numbered menu of HighLevel pipelines that people choose from when they ask for a report. It lists the current pipelines, numbers them, and writes the menu text and the list of valid numbers into two HighLevel custom values.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Any call with valid auth | n8n's immediate \"workflow started\" response. It says nothing about whether the menu was updated. |\n\nWorkflow: `Crear menú reportes CLEV` — node `Webhook`. Source: `workflows/CLEV/crear-menu-reportes-clev/crear-menu-reportes-clev.json`.","tags":["CLEV"],"security":[{"clevWebhookAuth":[]}],"responses":{"200":{"description":"Sent immediately, before the workflow runs. The body only confirms that the workflow was started.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/CLEV/crear-menu-reportes-clev/crear-menu-reportes-clev.json","node":"Webhook","responseMode":"onReceived","credential":"Header Auth new auto@clev.org"}}},"/clev/reporte":{"post":{"operationId":"informe-de-oportunidades-clev-v2-1","summary":"Informe de oportunidades CLEV v2.1","description":"Builds a report of HighLevel opportunities, counted by pipeline, stage and contact type, and posts it as a message in Basecamp. It is called over a webhook with the number of the pipeline the requester picked from a menu, and afterwards stores the link to the Basecamp message back in HighLevel.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Report posted | An empty response, once the Basecamp message exists and the link has been stored. |\n| Any step fails | n8n's error response; the failure is also emailed by `Notificación de errores`. |\n\nWorkflow: `Informe de oportunidades CLEV v2.1` — node `Webhook generación reporte`. Source: `workflows/CLEV/informe-de-oportunidades-clev-v2-1/informe-de-oportunidades-clev-v2-1.json`.","tags":["CLEV"],"security":[{"clevWebhookAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"full_name":{"type":"string","description":"Name of the requester, printed at the end of the report (\"Reporte solicitado por\")."},"customData":{"type":"object","properties":{"selection":{"type":"string","description":"Number of the menu entry the requester chose. `0` means all pipelines; any other number is a pipeline's position in the menu stored in HighLevel."}},"required":["selection"]}},"required":["customData"]}}}},"responses":{"200":{"description":"The output of the last node the workflow executed, returned once the workflow has finished.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/CLEV/informe-de-oportunidades-clev-v2-1/informe-de-oportunidades-clev-v2-1.json","node":"Webhook generación reporte","responseMode":"lastNode","credential":"Header Auth new auto@clev.org"}}},"/test":{"post":{"operationId":"webhook-test","summary":"Webhook test","description":"A two-node test workflow: a webhook followed by a wait. It does nothing else and looks like a leftover from trying out webhook authentication, but it is published, so its endpoint is live.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Any call with valid auth | The output of `Wait`, which is the incoming request passed through. |\n\nWorkflow: `Webhook test` — node `Webhook`. Source: `workflows/CLEV/webhook-test/webhook-test.json`.","tags":["CLEV"],"security":[{"headerAuth":[]}],"responses":{"200":{"description":"The output of the last node the workflow executed, returned once the workflow has finished.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/CLEV/webhook-test/webhook-test.json","node":"Webhook","responseMode":"lastNode","credential":"TEst"}}},"/5cb58ab5-2ee7-4020-be98-0ac665e594d1":{"post":{"operationId":"cambio-email-nombre","summary":"Cambio email-nombre","description":"Changes a Google Workspace user's primary email address and, optionally, their first and last name. It is called over a webhook, answers the caller as soon as the email has changed, and then removes the alias Google leaves behind on the old address.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Email changed | The updated Google Workspace user object plus `message` (first incoming item of `Respond to Webhook`). |\n| Validation failed, or user lookup failed | No `Respond to Webhook` node runs, so n8n sends its default response for a finished workflow. The `error`, `not_found` and `debug.*` fields built by the `Set` nodes are **not** returned. |\n| Email did not change | n8n's error response, because `Stop and Error` fails the execution before any response is sent. |\n\nWorkflow: `Cambio email-nombre` — node `Webhook`. Source: `workflows/google-workspace/cambio-email-nombre/cambio-email-nombre.json`.","tags":["Google Workspace"],"security":[{"workspaceBearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"correo":{"type":"string","description":"Current primary gadas.json","node":"Webhook","responseMode":"onReceived","credential":"Header Auth Bearer token n8n.workspace"}}},"/workspace/user/details":{"post":{"operationId":"workspaces-user-discovery-v1-4","summary":"Workspaces User Discovery v1.4","description":"Returns what a Google Workspace user has and belongs to: basic account details and, on request, admin details, shared drives, groups, delegated mailboxes, Chat spaces and Drive files. It is called over a webhook and answers with one combined object.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| User found | One object with the basic details plus a key for each section requested. |\n| Validation failed | `error` with the text built by `Prevalidation fails. Error message`. |\n| User lookup failed | `not_found`, `correo` and the `debug.*` fields from the `Not found…` node that ran. |\n\nWorkflow: `Workspaces User Discovery v1.4` — node `Webhook`. Source: `workflows/google-workspace/workspaces-user-discovery-v1-4/workspaces-user-discovery-v1-4.json`.","tags":["Google Workspace"],"security":[{"workspaceBearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"correo":{"type":"string","description":"Email of the user to look up. Must look like an email and its domain must be in the `Authorized domains` data table."},"sharedDrives":{"type":"boolean","description":"`true` adds the shared drives the user can see."},"moreDetails":{"type":"boolean","description":"`true` adds admin flags, alternate emails and recovery contact details."},"groups":{"type":"boolean","description":"`true` adds the groups the user belongs to."},"delegated":{"type":"boolean","description":"`true` adds the mailboxes delegated to the user."},"spaces":{"type":"boolean","description":"`true` adds the user's Chat spaces and group chats."},"driveFiles":{"type":"boolean","description":"`true` adds the three Drive file sections: `sharedToUser`, `sharedByUser` and `inSharedDrivesOwnedByUser`."}},"required":["correo"]}}}},"responses":{"200":{"description":"The output of the last node the workflow executed, returned once the workflow has finished.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/google-workspace/workspaces-user-discovery-v1-4/workspaces-user-discovery-v1-4.json","node":"Webhook","responseMode":"lastNode","credential":"Header Auth Bearer token n8n.workspace"}}},"/workspace/user/suspend":{"post":{"operationId":"suspender-cuenta-workspace-v1-0","summary":"Suspender cuenta Workspace v1.0","description":"Suspends a Google Workspace user account. It is called over a webhook with the user's email address.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Account suspended | The Google Workspace user object returned by the `PUT`. |\n| Validation failed | `error` with the text built by `Prevalidation fails. Error message`. |\n| User lookup failed | `not_found`, `correo` and the `debug.*` fields from the `Not found…` node that ran. |\n\nWorkflow: `Suspender cuenta Workspace v1.0` — node `Webhook`. Source: `workflows/google-workspace/suspender-cuenta-workspace-v1-0/suspender-cuenta-workspace-v1-0.json`.","tags":["Google Workspace"],"security":[{"workspaceBearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"correo":{"type":"string","description":"Email of the account to suspend. Must look like an email and its domain must be in the `Authorized domains` data table."}},"required":["correo"]}}}},"responses":{"200":{"description":"The output of the last node the workflow executed, returned once the workflow has finished.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/google-workspace/suspender-cuenta-workspace-v1-0/suspender-cuenta-workspace-v1-0.json","node":"Webhook","responseMode":"lastNode","credential":"Header Auth Bearer token n8n.workspace"}}},"/workspace/users":{"get":{"operationId":"reporte-validacion-usuarios-totales-v-1","summary":"Reporte Validación Usuarios Totales v 1","description":"Builds an Excel file of every Google Workspace user, with their groups and delegated mailboxes, and emails it. It runs when its webhook is called.\n\n### Responses\n\n| Situation | What the caller gets |\n|---|---|\n| Report sent | The output of `Send an Email`. |\n| User listing failed | `not_found`, `correo` and `debug.*` from the `Not found…` node that ran. |\n\nWorkflow: `Reporte Validación Usuarios Totales v 1` — node `Webhook`. Source: `workflows/google-workspace/reporte-validacion-usuarios-totales-v-1/reporte-validacion-usuarios-totales-v-1.json`.","tags":["Google Workspace"],"security":[{"workspaceBearer":[]}],"responses":{"200":{"description":"The output of the last node the workflow executed, returned once the workflow has finished.","content":{"application/json":{"schema":{"type":"object"}}}},"403":{"description":"The authentication header is missing or wrong."}},"x-n8n":{"workflowFile":"workflows/google-workspace/reporte-validacion-usuarios-totales-v-1/reporte-validacion-usuarios-totales-v-1.json","node":"Webhook","responseMode":"lastNode","credential":"Header Auth Bearer token n8n.workspace"}}}},"components":{"securitySchemes":{"clevWebhookAuth":{"type":"apiKey","in":"header","name":"webhook-auth","description":"Send the secret in the `webhook-auth` header. n8n credential: `Header Auth new auto@clev.org`."},"headerAuth":{"type":"apiKey","in":"header","name":"Authorization","description":"n8n header auth. The header name and value are held in the n8n credential named on the endpoint; the header name shown here is a placeholder."},"workspaceBearer":{"type":"http","scheme":"bearer","description":"Send `Authorization: Bearer \u003ctoken>`. n8n credential: `Header Auth Bearer token n8n.workspace`."}}}},
